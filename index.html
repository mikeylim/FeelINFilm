<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Find a film for whatever you’re feeling. Ask for movie recommendations or look up a title." />
    <meta name="theme-color" content="#0e1512" />
    <link rel="preconnect" href="https://image.tmdb.org" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      try { document.documentElement.dataset.theme = JSON.parse(localStorage.getItem('feelinfilm.theme')) === 'light' ? 'light' : 'dark' } catch {}
      try {
        const locale = JSON.parse(localStorage.getItem('feelinfilm.locale'))
        if (locale === 'ko' || locale === 'fr') document.documentElement.lang = locale
      } catch {}
    </script>
    <title>FeelINFilm · Find your next film</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
